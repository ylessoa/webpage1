<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiGestionSENA - Iniciar Sesión</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    .login-container h2 {
      margin-bottom: 24px;
      color: #333333;
      text-align: center;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #555555;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #39A900; /* Verde institucional SENA de referencia */
    }

    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background-color: #39A900;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button[type="submit"]:hover {
      background-color: #2d8500;
    }

    #error-message {
      color: #d9534f;
      font-size: 13px;
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>MiGestionSENA</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="correo@sena.edu.co">
      </div>
      
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit" id="login-btn">Ingresar</button>
    </form>
    <div id="error-message"></div>
  </div>

  <!-- Lógica de Firebase con Módulos ES -->
  <script type="module">
    // Importar SDKs necesarios de Firebase desde los CDN oficiales
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Configuración oficial de tu proyecto MiGestionSENA obtenida de la consola
    const firebaseConfig = {
      apiKey: "AIzaSyCL_O0UvS-DwgrP4gPO7Rh5qip3142RY1U",
      authDomain: "migestionsena.firebaseapp.com",
      projectId: "migestionsena",
      storageBucket: "migestionsena.firebasestorage.app",
      messagingSenderId: "1026834838150",
      appId: "1:1026834838150:web:7aa6d703c45d675e261707",
      measurementId: "G-KHHST2S36N"
    };

    // Inicializar Firebase y Auth
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Referencias a los elementos del DOM
    const loginForm = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const errorMessage = document.getElementById('error-message');

    // Manejar el evento de envío del formulario
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault(); // Evita recargar la página
      
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      errorMessage.textContent = ''; // Limpiar mensajes de error previos

      try {
        // Intentar autenticación en Firebase
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        
        console.log("Inicio de sesión exitoso:", user.email);
        alert("¡Bienvenido a MiGestionSENA!");
        
        // Redirección opcional al panel principal o dashboard
        // window.location.href = "./dashboard.html";

      } catch (error) {
        console.error("Error de autenticación:", error.code, error.message);
        
        // Traducción de errores comunes para el usuario final
        switch (error.code) {
          case 'auth/invalid-email':
            errorMessage.textContent = "El formato del correo electrónico no es válido.";
            break;
          case 'auth/user-not-found':
          case 'auth/wrong-password':
          case 'auth/invalid-credential':
            errorMessage.textContent = "Correo o contraseña incorrectos.";
            break;
          case 'auth/too-many-requests':
            errorMessage.textContent = "Demasiados intentos fallidos. Inténtalo más tarde.";
            break;
          default:
            errorMessage.textContent = "Ocurrió un error al iniciar sesión. Verifica tus datos.";
        }
      }
    });
  </script>

</body>
</html>
