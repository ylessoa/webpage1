<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiGestionSENA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
    }

    /* Pantalla de Inicio de Sesión (Bloqueo inicial) */
    #login-section {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #f4f7f6;
      z-index: 9999;
    }

    .login-container {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    .login-container h2 {
      margin-bottom: 24px;
      color: #333333;
      text-align: center;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #555555;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .form-group input:focus {
      outline: none;
      border-color: #39A900;
    }

    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background-color: #39A900;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button[type="submit"]:hover {
      background-color: #2d8500;
    }

    #error-message {
      color: #d9534f;
      font-size: 13px;
      margin-top: 15px;
      text-align: center;
    }

    /* Contenido Principal de tu Web (Oculto hasta autenticarse) */
    #app-content {
      display: none;
    }
  </style>
</head>
<body>

  <!-- VISTA 1: FORMULARIO DE ACCESO -->
  <div id="login-section">
    <div class="login-container">
      <h2>MiGestionSENA</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" required placeholder="correo@sena.edu.co">
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>

        <button type="submit" id="login-btn">Ingresar</button>
      </form>
      <div id="error-message"></div>
    </div>
  </div>

  <!-- VISTA 2: TU PÁGINA WEB ORIGINAL (Se muestra al iniciar sesión) -->
  <div id="app-content">
    
    <!-- PEGA AQUÍ EL CONTENIDO DE TU ARCHIVO ORIGINAL (Tus headers, tablas, secciones, etc.) -->
    <header style="background-color: #39A900; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;">
      <h1>MiGestionSENA - Panel Principal</h1>
      <button id="logout-btn" style="background-color: #ffffff; color: #39A900; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer;">Cerrar Sesión</button>
    </header>

    <main style="padding: 20px;">
      <h2>Bienvenido al sistema</h2>
      <p>Aquí puedes colocar todos los componentes y la estructura visual de tu página web original.</p>
    </main>

  </div>

  <!-- LÓGICA DE FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCL_O0UvS-DwgrP4gPO7Rh5qip3142RY1U",
      authDomain: "migestionsena.firebaseapp.com",
      projectId: "migestionsena",
      storageBucket: "migestionsena.firebasestorage.app",
      messagingSenderId: "1026834838150",
      appId: "1:1026834838150:web:7aa6d703c45d675e261707",
      measurementId: "G-KHHST2S36N"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginSection = document.getElementById('login-section');
    const appContent = document.getElementById('app-content');
    const loginForm = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const errorMessage = document.getElementById('error-message');
    const logoutBtn = document.getElementById('logout-btn');

    // Control de visibilidad según la sesión de Firebase
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Si hay sesión, oculta el login y muestra tu web
        loginSection.style.display = 'none';
        appContent.style.display = 'block';
      } else {
        // Si no hay sesión, muestra el login y oculta tu web
        loginSection.style.display = 'flex';
        appContent.style.display = 'none';
      }
    });

    // Manejar el login con correo y contraseña
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMessage.textContent = '';

      try {
        await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
      } catch (error) {
        switch (error.code) {
          case 'auth/invalid-email':
            errorMessage.textContent = "El formato del correo electrónico no es válido.";
            break;
          case 'auth/user-not-found':
          case 'auth/wrong-password':
          case 'auth/invalid-credential':
            errorMessage.textContent = "Correo o contraseña incorrectos.";
            break;
          case 'auth/too-many-requests':
            errorMessage.textContent = "Demasiados intentos fallidos. Inténtalo más tarde.";
            break;
          default:
            errorMessage.textContent = "Ocurrió un error al iniciar sesión. Verifica tus datos.";
        }
      }
    });

    // Botón para salir
    logoutBtn.addEventListener('click', async () => {
      await signOut(auth);
    });
  </script>

</body>
</html>
